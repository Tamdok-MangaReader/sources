<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open in Tamdok</title>
    <script>
      const REGISTRY_URL = 'https://tamdok-mangareader.github.io/sources/index.min.json';
      const DEEP_LINK = `tamdok://settings/sources?registry=${encodeURIComponent(REGISTRY_URL)}`;
    </script>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f2f2f7;
        color: #111;
      }
      main {
        max-width: 420px;
        text-align: center;
        background: #fff;
        border-radius: 16px;
        padding: 28px 24px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      }
      a {
        display: inline-block;
        margin-top: 16px;
        padding: 12px 18px;
        border-radius: 999px;
        background: #0a84ff;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }
      p {
        line-height: 1.5;
        color: #444;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #000;
          color: #f2f2f7;
        }
        main {
          background: #1c1c1e;
        }
        p {
          color: #d1d1d6;
        }
      }
    </style>
    <script>
      window.location.replace(DEEP_LINK);
    </script>
  </head>
  <body>
    <main>
      <h1>Open in Tamdok</h1>
      <p>Tamdok will open Settings → Sources and ask you to confirm adding this registry.</p>
      <a id="open-link" href="#">Open Tamdok</a>
    </main>
    <script>
      document.getElementById('open-link').href = DEEP_LINK;
    </script>
  </body>
</html>
